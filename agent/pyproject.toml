[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniagent"
version = "0.2.1"
description = "OmniAgent Engine — Hybrid Local/Cloud Edge Agent Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Japheth", email = "dev@omniagent.io"}
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jupyter>=1.0",
]
openai = ["openai>=1.30"]
google = ["google-genai>=1.0"]
all = ["omniagent[dev,openai,google]"]

[project.scripts]
omniagent = "omniagent.__main__:main"

[tool.setuptools.packages.find]
include = ["omniagent*"]
